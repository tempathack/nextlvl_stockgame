apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stock-game

resources:
  # Base
  - base/namespace.yaml
  - base/configmap.yaml
  - base/secrets.yaml

  # Database
  - database/postgres-init-configmap.yaml
  - database/postgres-statefulset.yaml
  - database/postgres-service.yaml
  - database/postgres-nodeport.yaml

  # Redis
  - redis/redis-statefulset.yaml
  - redis/redis-service.yaml

  # Backend
  - backend/backend-deployment.yaml
  - backend/backend-service.yaml
  - backend/backend-hpa.yaml

  # Frontend
  - frontend/frontend-deployment.yaml
  - frontend/frontend-service.yaml
  - frontend/frontend-hpa.yaml

  # Ingress
  - ingress/ingress.yaml

  # CronJobs
  - cronjobs/market-refresh-cronjob.yaml
  - cronjobs/sp500-hourly-cronjob.yaml
  - cronjobs/sp500-daily-cronjob.yaml

  # Jobs
  - jobs/data-migration-job.yaml
  - jobs/sp500-initial-load-job.yaml
