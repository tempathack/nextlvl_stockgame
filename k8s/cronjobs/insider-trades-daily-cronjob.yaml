apiVersion: batch/v1
kind: CronJob
metadata:
  name: insider-trades-daily
  namespace: stock-game
spec:
  schedule: "0 2 * * *"  # Run at 2 AM daily (after market close + SEC processing)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: insider-trades-daily
            image: stock-game-backend:latest
            imagePullPolicy: Never
            command:
            - python
            - -m
            - app.tasks.insider_trades_fetch
            envFrom:
            - configMapRef:
                name: stock-game-config
            - secretRef:
                name: stock-game-secrets
            resources:
              requests:
                memory: "256Mi"
                cpu: "200m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          restartPolicy: OnFailure
