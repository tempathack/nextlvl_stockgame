apiVersion: batch/v1
kind: CronJob
metadata:
  name: sp500-daily
  namespace: stock-game
spec:
  schedule: "30 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: sp500-daily
            image: stock-game-backend:latest
            imagePullPolicy: Never
            command:
            - python
            - -m
            - app.tasks.sp500_daily_fetch
            envFrom:
            - configMapRef:
                name: stock-game-config
            - secretRef:
                name: stock-game-secrets
            resources:
              requests:
                memory: "256Mi"
                cpu: "200m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          restartPolicy: OnFailure
