apiVersion: batch/v1
kind: Job
metadata:
  name: data-migration
  namespace: stock-game
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z postgres-service 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
      containers:
      - name: migrate
        image: stock-game-backend:latest
        imagePullPolicy: Never
        command:
        - python
        - scripts/migrate_data.py
        envFrom:
        - configMapRef:
            name: stock-game-config
        - secretRef:
            name: stock-game-secrets
      restartPolicy: Never
  backoffLimit: 3
